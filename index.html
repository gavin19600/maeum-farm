 else if(kind==='water'){const rings=[];for(let k=0;k<3;k++){const r=new THREE.Mesh(AG('Ring',.3,.4,24),new THREE.MeshBasicMaterial({color:lin(0xbfe6ff),transparent:true,opacity:0,depthWrite:false,toneMapped:false,side:THREE.DoubleSide}));r.rotation.x=-Math.PI/2;r.position.set(cx,.6,cz);g.add(r);rings.push(r)}const cloud=[mk(0xffffff,1.5,cx-.4,2.7,cz),mk(0xffffff,1.8,cx+.2,2.85,cz),mk(0xeaf6ff,1.4,cx+.7,2.7,cz)];fx.push({g,sc,t:0,dur:120,step:(g,k)=>{rings.forEach((r,q)=>{const u=(k*2.2-q*.3)%1;if(k*2.2-q*.3<0){r.material.opacity=0;return}r.scale.setScalar(1+u*2.6);r.material.opacity=.8*(1-u)*(1-k)});const o=Math.sin(Math.min(1,k*1.2)*Math.PI);cloud.forEach((c,q)=>{c.material.opacity=o*.9;c.position.y=2.75+Math.sin(k*8+q)*.05})}})}
 else{const sp=[];for(let k=0;k<12;k++){const a=k/12*Math.PI*2;sp.push([mk(k%2?0xbff08a:0xffe27a,.34,cx,.7,cz),a,R(.5,1)])}fx.push({g,sc,t:0,dur:110,step:(g,k)=>{for(const [m,a,r] of sp){m.position.set(cx+Math.cos(a+k*3)*r*(.4+k),.7+k*1.9,cz+Math.sin(a+k*3)*r*(.4+k));m.material.opacity=Math.sin(k*Math.PI)}}})}

function checkMix(){for(const m of MIX){if(state.mixes[m.name])continue;for(let i=0;i<9;i++){const a=state.plot[i];if(!a||a.stage<3)continue;const nb=[i-3,i+3,i%3?i-1:-1,i%3<2?i+1:-1].filter(j=>j>=0&&j<9);for(const j of nb){const b=state.plot[j];if(b&&b.stage>=3&&((a.emo===m.a&&b.emo===m.b)||(a.emo===m.b&&b.emo===m.a))){state.mixes[m.name]=today();save();renderDisplay();toast(`혼합 꽃 발견: ${m.name} · ${m.desc}`);return}}}}}

 const draw=(list)=>openSheet(P.stone.name,P.stone.tag,`<p class="lead">조약돌에 마음 한 줄을 적어 돌탑에 올려요. 농원의 모든 친구가 함께 쌓는 돌탑이에요.</p><div class="card">${list===null?'<p class="note">조약돌을 불러오는 중이에요</p>':list.length?list.map(p=>`<div class="pebble"><span>${esc(p.t)} <span class="note">· ${esc(p.nick)}</span></span>${isOwner&&p.id?`<button type="button" class="ghost" data-del="${esc(p.id)}">지우기</button>`:''}</div>`).join(''):'<p class="note">아직 조약돌이 없어요. 첫 조약돌을 올려 주세요.</p>'}</div><label class="q" for="pb">조약돌에 적을 한 줄</label><input type="text" id="pb" maxlength="40" placeholder="예: 오늘은 그냥 조용히 있고 싶었어"><p class="note">별명과 함께 모두에게 보여요. 이름, 학교, 전화번호는 적지 않아요.</p><button type="button" class="primary" id="ok">조약돌 올리기 (마음 씨앗 +1)</button><div id="out"></div>`,b=>{b.querySelectorAll('[data-del]').forEach(x=>x.onclick=async()=>{try{await db.doc('pebbles/'+x.dataset.del).delete();stoneSheet()}catch(e){toast('지우지 못했어요')}});b.querySelector('#ok').onclick=async()=>{const t=b.querySelector('#pb').value.trim();if(!t)return;const o=b.querySelector('#out');if(!publicText(t,o))return;state.pebbles.push({text:t,date:today()});state.pebbles=state.pebbles.slice(-30);save();if(shared){const items=state.pebbles.slice(-3).map(p=>({t:p.text,at:Date.now()}));await enqueue(()=>db.doc('pebbles/'+uid).set({nick:me().nick,items,updatedAt:Date.now()}))}renderTower(sharedPebbles);give('heart',1,'돌탑에 조약돌을 올렸어요');stoneSheet()}});
 const local=()=>state.pebbles.slice(-5).reverse().map(p=>({t:p.text,nick:'나'}));
 if(!shared){draw(local());return}
 draw(null);try{const s=await db.collection('pebbles').orderBy('updatedAt','desc').limit(30).get();const list=[];let total=0;for(const d of s.docs){const v=d.data();const items=Array.isArray(v.items)?v.items:[];total+=items.length;for(const it of items.slice().reverse())if(list.length<20)list.push({t:String(it.t||'').slice(0,40),nick:String(v.nick||'정원사').slice(0,8),id:d.id})}sharedPebbles=total;renderTower(total);if(!$('#sheet').hidden&&$('#shTitle').textContent===P.stone.name)draw(list)}catch(e){draw(local())}}

function peerPet(e,s){const k=(s.pt|0);const kind=PET_KEYS[k-1];const stg=clamp(s.pg|0,0,2);if(!kind){if(e.pet){e.pet.root.parent&&e.pet.root.parent.remove(e.pet.root);e.pet=null}return}if(e.pet&&(e.pet.kind!==kind||e.pet.stage!==stg)){e.pet.root.parent&&e.pet.root.parent.remove(e.pet.root);e.pet=null}if(!e.pet){e.pet=makePet(kind,stg,null,false);e.pet.hb.userData.pick={type:'ppet',e};livePick.push(e.pet.hb);e.pet.x=e.x-1;e.pet.z=e.z+1;curScene().add(e.pet.root)}}

function restAt(o){if(!o.keep)closeSheet();const go=()=>{pl.ry=o.ry;if(o.snap){pl.x=o.snap[0];pl.z=o.snap[1]}pl.sit=true;pl.lift=o.lift||0;pl.av.emote={id:o.emote||6,t0:clock.elapsedTime};myEmote={id:o.emote||6,at:Date.now()};sendPresence(true);sfx(o.snd||'sit');if(o.after)o.after()};if(Math.hypot(pl.x-o.pt[0],pl.z-o.pt[1])<.6)go();else walkTo(o.pt,go)}
function breathRest(title,tag,lead,key,max,res,msg){setTimeout(()=>openSheet(title,tag,`<p class="lead">${lead}</p>${BREATH}<div id="out"></div>`,b=>breath(b,[['숨 들이쉬기',4,1.45],['길게 내쉬기',6,.8]],2,()=>{if(dcount(key)<max){dinc(key);state.log.calm++;give(res,1,msg)}else toast('푹 쉬었어요. 언제든 또 쉬러 와요')})),500)}
function nearestChair(){let best=null,bd=1e9;for(const c of CHAIRS){const d=Math.hypot(pl.x-c[0],pl.z-c[1]);if(d<bd){bd=d;best=c}}return best}
function chairSit(after,emote){const c=nearestChair();if(!c)return;const fx2=c[0]+Math.sin(c[2])*.15,fz2=c[1]+Math.cos(c[2])*.15;restAt({pt:[c[0]+Math.sin(c[2])*.9,c[1]+Math.cos(c[2])*.9],snap:[fx2,fz2],ry:c[2],emote,after})}
function tentRest(x,z){if(x==null){[x,z]=TENTS[0]||[CAMP.x,CAMP.z+12]}const ry=Math.atan2(CAMP.x-x,CAMP.z-z);restAt({pt:[x+Math.sin(ry)*2.4,z+Math.cos(ry)*2.4],ry:ry+Math.PI,snd:'tent',after:()=>setTimeout(()=>{const W=[['☀️','맑음'],['⛅','구름 조금'],['☁️','흐림'],['🌧️','비'],['🌬️','바람'],['🌈','무지개']];openSheet('텐트 쉼터','별빛 캠핑장',`<p class="lead">텐트 안은 조용해요. 지금 내 마음은 어떤 날씨인가요?</p><div class="phr">${W.map(([i,n])=>`<button type="button" class="opt" data-w="${n}">${i} ${n}</button>`).join('')}</div><div id="out"></div>`,b=>b.querySelectorAll('[data-w]').forEach(x=>x.onclick=()=>{b.querySelectorAll('[data-w]').forEach(y=>y.disabled=true);const w=x.dataset.w;const msg={'맑음':'맑은 마음, 오늘 그 기분을 오래 기억해요.','구름 조금':'조금 흐려도 괜찮아요. 구름은 지나가요.','흐림':'흐린 날도 있어요. 따뜻한 걸 마시며 쉬어 가요.','비':'비 오는 마음이구나. 혼자 젖지 말고 믿는 사람에게 우산을 부탁해요.','바람':'마음이 들썩이네요. 숨을 길게 내쉬어 봐요.','무지개':'힘든 시간을 지나왔군요. 정말 잘했어요.'}[w];b.querySelector('#out').innerHTML=`<div class="card"><p>${msg}</p></div>`;if(dcount('tent')<2){dinc('tent');state.log.reflect++;give('sun',1,'마음 날씨를 살펴봤어요. 햇빛 1개를 받았어요')}}))},600)})}
function hammockRest(hx,hz){if(hx==null){[hx,hz]=HAMS[0]||[CAMP.x+19.5,CAMP.z-3]}restAt({pt:[hx,hz],snap:[hx,hz],ry:Math.PI/2,lift:.42,after:()=>breathRest('해먹에서 쉬기','별빛 캠핑장','해먹이 흔들흔들. 눈을 감고 바람 소리를 들어요.','ham',2,'water','푹 쉬었어요. 물 1개를 받았어요')})}

function roastSheet(){const left=Math.max(0,3-dcount('roast'));openSheet('마시멜로 굽기','별빛 캠핑장',`<p class="lead">노릇노릇해질 때까지 기다렸다가 꺼내요. 너무 서두르면 덜 익고, 너무 오래 두면 타요.</p><div class="roast"><div class="mm" id="mm"></div><div class="rbar"><span class="zone"></span><i id="rb"></i></div><p class="phase" id="rs">불 위에 올렸어요</p></div><div class="row"><button type="button" class="primary" id="pull">꺼내기!</button><button type="button" class="ghost" id="again" hidden>다시 굽기</button></div><div id="out"></div><p class="note">노릇하게 구우면 햇빛 1개 (오늘 ${left}번 더)</p>`,(b,tk)=>{const t0=performance.now(),D=6000;let done=false,lastS=0;roast={k:0};const mm=b.querySelector('#mm'),rb=b.querySelector('#rb'),rs=b.querySelector('#rs');const col=k=>{const c=new THREE.Color(0xfffaf0).lerp(new THREE.Color(0xe0a050),Math.min(1,k/.65));if(k>.82)c.lerp(new THREE.Color(0x3a2618),Math.min(1,(k-.82)/.18));return c};(function tick(){if(tk!==token||done)return;const k=Math.min(1,(performance.now()-t0)/D);roast.k=k;rb.style.width=(k*100)+'%';mm.style.background='#'+col(k).getHexString();rs.textContent=k<.4?'아직 하얘요':k<.58?'조금씩 익는 중':k<.82?'노릇노릇! 지금이에요':'앗, 타기 시작했어요';if(pl.av.mm)pl.av.mm.color.copy(col(k)).convertSRGBToLinear();if(performance.now()-lastS>450){lastS=performance.now();sfx('sizzle',.6+k*.4)}if(k>=1){finish();return}requestAnimationFrame(tick)})();
  function finish(){if(done)return;done=true;const k=roast.k;b.querySelector('#pull').disabled=true;b.querySelector('#again').hidden=false;const o=b.querySelector('#out');if(k>=.58&&k<=.82){o.innerHTML='<div class="card"><p><b>완벽해요!</b> 기다림 끝에 노릇노릇한 마시멜로가 됐어요. 기다리는 힘도 마음의 근육이에요.</p></div>';sfx('crunch');setTimeout(()=>sfx('fanfare'),250);confetti(30);hearts(pl.x,2.4,pl.z,3);if(dcount('roast')<3){dinc('roast');state.log.calm++;give('sun',1,'노릇한 마시멜로! 햇빛 1개를 받았어요')}}else if(k<.58){o.innerHTML='<div class="card"><p><b>아직 덜 익었어요.</b> 조금만 더 기다려 볼까요?</p></div>';sfx('pop')}else{o.innerHTML='<div class="card"><p><b>앗, 살짝 탔어요.</b> 실수해도 괜찮아요. 다음엔 조금 더 일찍 꺼내 봐요.</p></div>';sfx('laugh')}}
  b.querySelector('#pull').onclick=finish;b.querySelector('#again').onclick=()=>roastSheet()})}
function campSheet(){const q=CAMP_Q[(new Date().getDate()+new Date().getHours())%CAMP_Q.length];openSheet(P.camp.name,P.camp.tag,`<p class="lead">모닥불 가에 둘러앉아 마음을 녹여요. 불꽃을 바라보며 숨을 고르거나, 마시멜로를 구워 봐요.</p><div class="places"><button type="button" data-a="roast">🍡 마시멜로 굽기<small>타이밍 맞추기 · 햇빛</small></button><button type="button" data-a="fire">🔥 불멍 하기<small>불꽃 보며 숨 고르기 · 물</small></button><button type="button" data-a="tent">⛺ 텐트에서 쉬기<small>마음 날씨 살피기 · 햇빛</small></button><button type="button" data-a="ham">🌙 해먹에서 쉬기<small>흔들흔들 쉬기 · 물</small></button></div><div class="card"><p class="qh">모닥불 이야기</p><p>${q}</p><p class="note">친구와 함께라면 말풍선으로 이야기를 나눠 봐요.</p></div>`,b=>{b.querySelector('[data-a="roast"]').onclick=roastStart;b.querySelector('[data-a="fire"]').onclick=()=>chairSit(()=>breathRest('불멍 하기','별빛 캠핑장','타닥타닥 불꽃을 바라봐요. 생각이 떠오르면 불꽃에 실어 보내요.','fire',2,'water','마음이 따뜻해졌어요. 물 1개를 받았어요'));b.querySelector('[data-a="tent"]').onclick=()=>tentRest();b.querySelector('[data-a="ham"]').onclick=hammockRest})}
function poolSheet(){openSheet(P.pool.name,P.pool.tag,`<p class="lead">시원한 물에 몸을 맡기면 마음도 가벼워져요. 물에 들어가면 헤엄을 쳐요. 물속에서도 걷기와 점프를 할 수 있어요.</p><div class="places"><button type="button" data-a="swim">🏊 물에 들어가기<small>헤엄치기 · 오늘 첫 수영 물 +1</small></button><button type="button" data-a="slide">🛝 미끄럼틀 타기<small>슝~ 풍덩!</small></button><button type="button" data-a="lounge">🏖️ 선베드에서 쉬기<small>햇볕 쬐며 쉬기 · 햇빛</small></button></div><div class="card"><p class="qh">물놀이 약속</p><p>뛰지 않기 · 친구 밀지 않기 · 힘들면 쉬기. 지킴이 파도가 지켜보고 있어요.</p></div>`,b=>{b.querySelector('[data-a="swim"]').onclick=()=>{closeSheet();walkTo([POOL.x-POOL.w/2+5,POOL.z+3])};b.querySelector('[data-a="slide"]').onclick=()=>{closeSheet();slideRide()};b.querySelector('[data-a="lounge"]').onclick=()=>{const l=LOUNGE[(Math.random()*LOUNGE.length)|0];loungeRest(l[0],l[1])}})}
function slideRide(){closeSheet();if(!SLIDE.length)return;const s=SLIDE[0];if(Math.hypot(pl.x-s[0],pl.z-s[2])>1){walkTo([s[0],s[2]],slideRide);return}pl.sit=false;pl.av.emote=null;pl.ride={i:0,u:0};sendPresence(true)}
function rideStep(dt,t){const r=pl.ride,P2=SLIDE;const a=P2[r.i],b=P2[r.i+1];const L=Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2])||.01;const climb=r.i<3,last=r.i>=P2.length-2;r.u+=(climb?2.4:last?5:8)*dt/L;while(r.u>=1&&pl.ride){r.u-=1;r.i++;if(r.i===4)sfx('whoosh');if(r.i>=P2.length-1){pl.ride=null;pl.x=b[0];pl.y=Math.max(0,b[1]);pl.z=b[2];pl.vy=1.5;pl.sit=false;pl.av.emote=null;sendPresence(true);return}}const a2=P2[r.i],b2=P2[r.i+1],k=r.u;pl.x=a2[0]+(b2[0]-a2[0])*k;pl.y=a2[1]+(b2[1]-a2[1])*k;pl.z=a2[2]+(b2[2]-a2[2])*k;pl.ry=-Math.PI/2;const chute=r.i>=4&&!last;const av=pl.av;av.root.position.set(pl.x,pl.y,pl.z);av.root.rotation.y=pl.ry;moveState=climb?1:0;animAvatar(av,dt,moveState,last,chute,t);if(chute){av.body.position.y=-.3;av.armL.rotation.set(-.2,0,1.2);av.armR.rotation.set(-.2,0,-1.2)}if(climb&&r.i===1){av.armL.rotation.x=-2.6+Math.sin(t*8)*.4;av.armR.rotation.x=-2.6-Math.sin(t*8)*.4}}
